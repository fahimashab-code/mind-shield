<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mind Shield</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <main class="popup">
      <header class="popup-header">
        <a class="brand" href="dashboard.html" target="_blank"
          ><img src="icons/mark.svg" alt="" width="32" height="32" />Mind
          Shield</a
        ><span class="status" id="status">Loading</span>
      </header>
      <div class="popup-symbol">
        <img src="icons/mark.svg" alt="" width="54" height="54" />
      </div>
      <p class="eyebrow center" id="session-label">YOUR SPACE TO FOCUS</p>
      <h1 id="timer" class="popup-timer">00:00:00</h1>
      <p id="description" class="muted center">
        A little distance from distraction.
      </p>
      <button class="button primary full" id="toggle" disabled>Loading…</button>
      <p class="micro center" id="challenge-hint">
        One click to protect your focus.
      </p>
      <div class="popup-stats">
        <div>
          <span class="eyebrow">BLOCKED SITES</span
          ><strong id="site-count">—</strong>
        </div>
        <div>
          <span class="eyebrow">BROWSING TODAY</span
          ><strong id="today">—</strong>
        </div>
      </div>
      <p id="notice" class="notice" role="alert" hidden></p>
      <button id="dashboard" class="button secondary full">
        Open dashboard <span aria-hidden="true">↗</span>
      </button>
      <footer class="micro center">
        Private by design. Stored on this device.
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
