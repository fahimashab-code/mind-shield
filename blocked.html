<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mind Shield · Focus protected</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="standalone-body blocked-body">
    <main class="blocked-shell">
      <a class="brand" href="dashboard.html"
        ><img src="icons/mark.svg" alt="" width="34" height="34" />Mind
        Shield</a
      >
      <div class="blocked-emblem">
        <img src="icons/mark.svg" width="100" height="100" alt="" />
        <div id="blocked-mascot" hidden></div>
      </div>
      <p class="eyebrow" id="blocked-status">YOUR SHIELD IS ACTIVE</p>
      <h1 id="blocked-heading">This can wait.<br />Your focus comes first.</h1>
      <p class="muted" id="blocked-description">
        You chose to give yourself a little distance from this website.
      </p>
      <p class="blocked-site" id="blocked-site"></p>
      <p id="blocked-joke" class="blocked-joke" hidden></p>
      <div id="blocked-reminder" class="personal-reminder" hidden></div>
      <a class="button primary" href="dashboard.html"
        >Back to my focus space ↗</a
      >
      <p class="micro" id="blocked-hint">
        Need to change your boundaries? Open the dashboard.<br />Turning off
        Shield takes seven correct math answers.
      </p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
